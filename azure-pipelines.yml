trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package -DskipTests'
    publishJUnitResults: true

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'target'
    artifactName: 'petcare-artifact'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'azure-clyvo-sprint4'
    appType: 'webAppLinux'
    appName: 'clyvo-petcare-sprint4'
    package: 'target/*.jar'
