
trigger:
- main

pool:
   name: Default

steps:

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'target'
    artifactName: 'petcare-artifact'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'azure-clyvo-sprint4'
    appType: 'webAppLinux'
    appName: 'clyvo-petcare-sprint4-lari2026'
    package: 'target/*.jar'
